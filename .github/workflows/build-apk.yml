name: Build TRACK360 APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    name: Build TRACK360 APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. SETUP JAVA 17
      # IMPORTANT :
      # PAS DE "cache: gradle" ici.
      # Le projet Gradle est encore dans le ZIP à ce moment.
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. RECHERCHE DU ZIP TRACK360
      # ============================================================
      - name: Locate TRACK360 ZIP
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo " RECHERCHE DU ZIP TRACK360"
          echo "===================================="

          echo "ZIP disponibles dans le dépôt :"

          find . -maxdepth 3 -type f \
            \( -iname "*.zip" \) \
            -print

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            \( -iname "TRACK360*.zip" -o -iname "*TRACK360*.zip" \) \
            | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERREUR : aucun ZIP TRACK360 trouvé."
            echo ""
            echo "ZIP disponibles :"
            find . -maxdepth 4 -type f -iname "*.zip" -print
            exit 1
          fi

          echo ""
          echo "ZIP trouvé : $ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 4. EXTRACTION
      # ============================================================
      - name: Extract TRACK360 project
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo " EXTRACTION TRACK360"
          echo "===================================="

          rm -rf track360_build

          mkdir -p track360_build

          unzip -q "$ZIP_FILE" -d track360_build

          echo ""
          echo "Projet extrait."

          echo ""
          echo "Fichiers principaux :"

          find track360_build -maxdepth 5 -type f \
            | sed -n '1,150p'


      # ============================================================
      # 5. RECHERCHE DU PROJET GRADLE
      # ============================================================
      - name: Find Android Gradle project
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo " RECHERCHE PROJET ANDROID"
          echo "===================================="

          PROJECT_DIR=""

          # Priorité au Gradle Wrapper
          GRADLEW=$(find track360_build \
            -type f \
            -name "gradlew" \
            | head -1)

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR=$(dirname "$GRADLEW")
          fi

          # Si gradlew absent, chercher settings.gradle
          if [ -z "$PROJECT_DIR" ]; then
            SETTINGS=$(find track360_build \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              | head -1)

            if [ -n "$SETTINGS" ]; then
              PROJECT_DIR=$(dirname "$SETTINGS")
            fi
          fi

          # Dernier recours : build.gradle
          if [ -z "$PROJECT_DIR" ]; then
            BUILD_FILE=$(find track360_build \
              -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              | head -1)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo ""
            echo "ERREUR : aucun projet Gradle Android trouvé."
            echo ""
            echo "Contenu du ZIP :"
            find track360_build -maxdepth 7 -type f -print
            exit 1
          fi

          echo ""
          echo "Projet Gradle trouvé :"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 6. VERIFICATION DU PROJET
      # ============================================================
      - name: Check TRACK360 project
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo " TRACK360 ANDROID"
          echo "===================================="

          echo ""
          echo "PROJECT_DIR:"
          echo "$PROJECT_DIR"

          echo ""
          echo "Contenu :"
          ls -la "$PROJECT_DIR"

          echo ""

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            echo "Gradle Wrapper : OK"
          else
            echo "ERREUR : gradlew absent."
            exit 1
          fi

          if [ -f "$PROJECT_DIR/settings.gradle" ] || \
             [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "Settings Gradle : OK"
          else
            echo "ERREUR : settings.gradle absent."
            exit 1
          fi


      # ============================================================
      # 7. GRADLE EXECUTABLE
      # ============================================================
      - name: Make Gradle executable
        shell: bash
        run: |
          set -e

          chmod +x "$PROJECT_DIR/gradlew"

          echo "Gradle Wrapper prêt."


      # ============================================================
      # 8. CONFIGURATION JVM 17
      #
      # Corrige le problème :
      #
      # JavaCompile = 1.8
      # KotlinCompile = 17
      #
      # Tout sera compilé en JVM 17.
      # ============================================================
      - name: Configure JVM 17
        shell: bash
        run: |
          set -e

          cat > "$PROJECT_DIR/track360-jvm17.gradle" <<'EOF'
          allprojects {

              tasks.withType(JavaCompile).configureEach {
                  options.release = 17
              }

              tasks.matching {
                  it.name.startsWith("compile") &&
                  it.name.endsWith("Kotlin")
              }.configureEach {
                  kotlinOptions.jvmTarget = "17"
              }
          }
          EOF

          echo "Configuration JVM 17 :"

          cat "$PROJECT_DIR/track360-jvm17.gradle"


      # ============================================================
      # 9. VERIFICATION JAVA / GRADLE
      # ============================================================
      - name: Check Java and Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo " JAVA / GRADLE"
          echo "===================================="

          java -version

          echo ""

          ./gradlew --version


      # ============================================================
      # 10. BUILD APK
      # ============================================================
      - name: Build TRACK360 Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo " BUILD TRACK360 APK"
          echo " JVM 17"
          echo "===================================="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            -I track360-jvm17.gradle \
            assembleDebug


      # ============================================================
      # 11. RECHERCHE APK
      # ============================================================
      - name: Find TRACK360 APK
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo " RECHERCHE APK"
          echo "===================================="

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | grep -E "debug|release" \
            | head -1)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERREUR : APK introuvable."

            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo ""
          echo "APK trouvée :"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"


      # ============================================================
      # 12. VERIFICATION APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          if [ ! -f "$APK" ]; then
            echo "ERREUR : APK inexistante."
            exit 1
          fi

          echo "APK valide : $APK"

          ls -lh "$APK"


      # ============================================================
      # 13. UPLOAD APK
      # ============================================================
      - name: Upload TRACK360 APK
        uses: actions/upload-artifact@v4
        with:
          name: TRACK360-debug-apk
          path: ${{ env.APK }}
          if-no-files-found: error

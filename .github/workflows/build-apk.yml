name: Build TRACK360 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Find and extract TRACK360 package
        run: |
          echo "========================================"
          echo "Recherche du package TRACK360 corrigé"
          echo "========================================"

          ZIP=$(find . -maxdepth 1 -type f -name 'TRACK360_CORRECTED_*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : package TRACK360_CORRECTED introuvable."
            echo ""
            echo "Fichiers ZIP disponibles :"
            find . -maxdepth 1 -type f -name '*.zip' -print
            exit 1
          fi

          echo "Package trouvé : $ZIP"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP" -d project

          echo ""
          echo "========================================"
          echo "Structure du package"
          echo "========================================"

          find project -maxdepth 4 -type f | sort

      - name: Detect Android project directory
        run: |
          echo "========================================"
          echo "Recherche du projet Android"
          echo "========================================"

          SETTINGS=$(find project -type f -name "settings.gradle.kts" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERREUR : settings.gradle.kts introuvable."
            echo ""
            echo "Fichiers trouvés :"
            find project -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projet Android trouvé : $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Java
        run: |
          echo "========================================"
          echo "Version Java"
          echo "========================================"
          java -version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Check Gradle
        run: |
          echo "========================================"
          echo "Version Gradle"
          echo "========================================"
          gradle --version

      - name: Check Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "========================================"
          echo "Projet Android"
          echo "========================================"

          echo "Répertoire :"
          pwd

          echo ""
          echo "Fichiers Gradle :"
          find . -maxdepth 3 \( \
            -name "build.gradle.kts" \
            -o -name "settings.gradle.kts" \
            -o -name "gradle.properties" \
          \) -print

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "========================================"
          echo "BUILD TRACK360 APK"
          echo "========================================"

          gradle assembleDebug --no-daemon

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "========================================"
          echo "Recherche de l'APK"
          echo "========================================"

          find . -type f -name "*.apk" -print

          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo ""
            echo "ERREUR : APK introuvable."
            exit 1
          fi

          echo ""
          echo "APK trouvé : $APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TRACK360-debug-apk
          path: ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
          if-no-files-found: error

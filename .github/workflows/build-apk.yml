name: Build TRACK360 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:
    name: Build TRACK360 APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. RECHERCHE DU ZIP
      # ============================================================
      - name: Locate TRACK360 ZIP
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo " RECHERCHE DU ZIP TRACK360"
          echo "===================================="

          find . -maxdepth 3 -type f -iname "*.zip" -print

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            -iname "*TRACK360*.zip" \
            | head -1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERREUR : aucun ZIP TRACK360 trouvé."
            exit 1
          fi

          echo "ZIP trouvé : $ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 4. EXTRACTION
      # ============================================================
      - name: Extract TRACK360 project
        shell: bash
        run: |
          set -e

          rm -rf track360_build
          mkdir -p track360_build

          unzip -q "$ZIP_FILE" -d track360_build

          echo "Projet extrait."

          find track360_build -maxdepth 4 -type f | head -150


      # ============================================================
      # 5. TROUVER LE PROJET ANDROID
      # ============================================================
      - name: Find Android Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find track360_build \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERREUR : settings.gradle(.kts) introuvable."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Projet Android trouvé :"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 6. VERIFICATION DU PROJET
      # ============================================================
      - name: Check TRACK360 project
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo " TRACK360 ANDROID"
          echo "===================================="

          echo "PROJECT_DIR=$PROJECT_DIR"

          echo ""
          echo "Fichiers :"
          ls -la "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERREUR : settings.gradle(.kts) absent."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "ERREUR : build.gradle(.kts) absent."
            exit 1
          fi

          echo ""
          echo "Projet Gradle OK."


      # ============================================================
      # 7. INSTALLATION GRADLE 8.9
      # ============================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ============================================================
      # 8. VERIFICATION JAVA / GRADLE
      # ============================================================
      - name: Check Java and Gradle
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo " JAVA / GRADLE"
          echo "===================================="

          java -version

          echo ""

          gradle --version


      # ============================================================
      # 9. FORCER JVM 17
      # ============================================================
      - name: Configure JVM 17
        shell: bash
        run: |
          set -e

          cat > "$PROJECT_DIR/track360-jvm17.gradle" <<'EOF'
          allprojects {

              tasks.withType(JavaCompile).configureEach {
                  options.release = 17
              }

              tasks.matching {
                  it.name.startsWith("compile") &&
                  it.name.endsWith("Kotlin")
              }.configureEach {
                  kotlinOptions.jvmTarget = "17"
              }
          }
          EOF

          echo "Configuration JVM 17 créée."

          cat "$PROJECT_DIR/track360-jvm17.gradle"


      # ============================================================
      # 10. BUILD APK
      # ============================================================
      - name: Build TRACK360 Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "===================================="
          echo " BUILD TRACK360 APK"
          echo " GRADLE 8.9"
          echo " JAVA 17"
          echo "===================================="

          gradle \
            --no-daemon \
            --stacktrace \
            -I track360-jvm17.gradle \
            assembleDebug


      # ============================================================
      # 11. RECHERCHE APK
      # ============================================================
      - name: Find TRACK360 APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERREUR : APK introuvable."

            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "APK trouvée : $APK"

          echo "APK=$APK" >> "$GITHUB_ENV"


      # ============================================================
      # 12. VERIFICATION APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          test -f "$APK"

          echo "APK valide :"
          ls -lh "$APK"


      # ============================================================
      # 13. UPLOAD APK
      # ============================================================
      - name: Upload TRACK360 APK
        uses: actions/upload-artifact@v4
        with:
          name: TRACK360-debug-apk
          path: ${{ env.APK }}
          if-no-files-found: error

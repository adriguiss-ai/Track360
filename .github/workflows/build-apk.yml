name: Build TRACK360 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract TRACK360 project
        run: |
          mkdir project
          unzip -q TRACK360_GITHUB_READY_V2.zip -d project

          echo "Recherche du projet Android..."
          PROJECT_DIR=$(dirname "$(find project -name gradlew -type f | head -1)")

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            echo "ERREUR : gradlew introuvable dans le ZIP."
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Projet trouvé dans : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          chmod +x "$PROJECT_DIR/gradlew"
          "$PROJECT_DIR/gradlew" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TRACK360-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk

name: Build TRACK360 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract project
        run: |
          mkdir project
          unzip -q TRACK360_GITHUB_READY_V2.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Fix Kotlin Serialization
        working-directory: project
        run: |
          if ! grep -q 'org.jetbrains.kotlin.plugin.serialization' build.gradle.kts; then
            sed -i '/kotlin.plugin.compose.*apply false/a\    id("org.jetbrains.kotlin.plugin.serialization") version "2.0.21" apply false' build.gradle.kts
          fi

          if ! grep -q 'org.jetbrains.kotlin.plugin.serialization' app/build.gradle.kts; then
            sed -i '/kotlin.plugin.compose/a\    id("org.jetbrains.kotlin.plugin.serialization")' app/build.gradle.kts
          fi

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TRACK360-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk

name: Build TRACK360 APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    name: Build TRACK360 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Locate and extract TRACK360 project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf package build_project
          mkdir -p package build_project

          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"

          if [ -z "${ZIP_FILE}" ]; then
            echo "ERREUR : aucun fichier ZIP TRACK360 trouvé à la racine."
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "ZIP trouvé : ${ZIP_FILE}"

          unzip -q "${ZIP_FILE}" -d package

          if [ -f package/settings.gradle.kts ] || [ -f package/settings.gradle ]; then
            cp -a package/. build_project/
          else
            PROJECT_ZIP="$(find package -type f -name 'TRACK360_Android_Project.zip' -print -quit)"

            if [ -z "${PROJECT_ZIP}" ]; then
              PROJECT_ZIP="$(find package -type f -name '*.zip' -print -quit)"
            fi

            if [ -z "${PROJECT_ZIP}" ]; then
              echo "ERREUR : aucun projet Android Gradle trouvé."
              find package -maxdepth 4 -type f | sort
              exit 1
            fi

            unzip -q "${PROJECT_ZIP}" -d build_project
          fi

          if [ ! -f build_project/settings.gradle.kts ] && \
             [ ! -f build_project/settings.gradle ]; then

            ROOT_DIR="$(find build_project \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print -quit)"

            if [ -n "${ROOT_DIR}" ] && \
               { [ -f "${ROOT_DIR}/settings.gradle.kts" ] || \
                 [ -f "${ROOT_DIR}/settings.gradle" ]; }; then

              cp -a "${ROOT_DIR}"/. build_project/
            fi
          fi

          echo "=== PROJET TRACK360 ==="
          find build_project -maxdepth 3 -type f | sort

          test -f build_project/settings.gradle.kts || \
          test -f build_project/settings.gradle

          test -f build_project/app/build.gradle.kts || \
          test -f build_project/app/build.gradle

          test -f build_project/app/src/main/AndroidManifest.xml

          test -f build_project/app/src/main/java/com/track360/app/MainActivity.kt

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build TRACK360 Debug APK
        working-directory: build_project
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find build_project/app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "${APK}" ]; then
            echo "ERREUR : APK introuvable."
            find build_project/app/build -maxdepth 5 -type f | sort || true
            exit 1
          fi

          echo "APK généré : ${APK}"

          cp "${APK}" TRACK360-debug.apk

      - name: Upload TRACK360 APK
        uses: actions/upload-artifact@v4
        with:
          name: TRACK360-debug-apk
          path: TRACK360-debug.apk
          if-no-files-found: error

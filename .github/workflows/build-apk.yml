name: Build TRACK360 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build TRACK360 APK
    runs-on: ubuntu-latest

    steps:

      # 1. CHECKOUT
      - name: Checkout
        uses: actions/checkout@v4

      # 2. JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. GRADLE 8.9
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 4. FIND TRACK360 ZIP
      - name: Locate TRACK360 ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCH TRACK360 ZIP"
          echo "=========================================="

          ZIP_FILE=""

          if [ -f "TRACK360_Android_Project_V8_EXCEL_SYNTHESE.zip" ]; then
            ZIP_FILE="TRACK360_Android_Project_V8_EXCEL_SYNTHESE.zip"
          else
            ZIP_FILE=$(find . -maxdepth 3 -type f \
              \( -iname "TRACK360*.zip" -o -iname "*Track360*.zip" \) \
              -print -quit)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: TRACK360 ZIP introuvable."
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "ZIP trouvé : $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # 5. EXTRACT ZIP
      - name: Extract TRACK360 project
        shell: bash
        run: |
          set -e

          rm -rf track360_build
          mkdir -p track360_build

          unzip -q "$ZIP_FILE" -d track360_build

          echo "Projet extrait:"
          find track360_build -maxdepth 4 -type f -print | head -200

      # 6. FIND ANDROID GRADLE PROJECT
      - name: Find Android Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find track360_build \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Aucun projet Gradle Android trouvé."
            find track360_build -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 7. CHECK PROJECT
      - name: Check Gradle project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "CHECK GRADLE PROJECT"
          echo "=========================================="

          pwd

          find . -maxdepth 3 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradlew" \) \
            -print

      # 8. PREPARE GRADLE WRAPPER
      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper trouvé."
          else
            echo "Gradle wrapper absent."
            echo "Gradle 8.9 sera utilisé."
          fi

      # 9. CONFIGURATION JAVA/KOTLIN 17
      - name: Configure JVM 17
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          cat > track360-jvm17.gradle <<'EOF'

          import org.gradle.api.tasks.compile.JavaCompile

          allprojects {

              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }

              tasks.configureEach { task ->

                  if (task.name.toLowerCase().contains("kotlin")) {

                      try {
                          task.kotlinOptions.jvmTarget = "17"
                      } catch (Exception ignored) {
                      }

                      try {
                          task.compilerOptions.jvmTarget.set(
                              org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                          )
                      } catch (Exception ignored) {
                      }
                  }
              }

              afterEvaluate { project ->

                  def androidExtension =
                      project.extensions.findByName("android")

                  if (androidExtension != null) {

                      try {
                          androidExtension.compileOptions.sourceCompatibility =
                              JavaVersion.VERSION_17

                          androidExtension.compileOptions.targetCompatibility =
                              JavaVersion.VERSION_17
                      } catch (Exception ignored) {
                      }
                  }
              }
          }

          EOF

      # 10. CLEAN
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            ./gradlew clean \
              --no-daemon \
              -I track360-jvm17.gradle
          else
            gradle clean \
              --no-daemon \
              -I track360-jvm17.gradle
          fi

      # 11. BUILD DEBUG APK
      - name: Build TRACK360 Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "BUILD TRACK360 APK"
          echo "=========================================="

          echo "Gradle : 8.9"
          echo "Java   : 17"
          echo "Kotlin : 17"

          if [ -f "./gradlew" ]; then

            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              -I track360-jvm17.gradle

          else

            gradle assembleDebug \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              -I track360-jvm17.gradle

          fi

      # 12. FIND APK
      - name: Find TRACK360 APK
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            -print \
            | grep -E "debug.*\.apk$" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK introuvable."
            find "$PROJECT_DIR" -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK trouvée:"
          echo "$APK_FILE"

          APK_ABSOLUTE="$(realpath "$APK_FILE")"

          echo "APK_FILE=$APK_ABSOLUTE" >> "$GITHUB_ENV"

      # 13. VERIFY APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFY APK"
          echo "=========================================="

          ls -lh "$APK_FILE"
          file "$APK_FILE"

          SIZE=$(stat -c%s "$APK_FILE")

          if [ "$SIZE" -lt 10000 ]; then
            echo "ERROR: APK anormalement petite."
            exit 1
          fi

          echo "APK valide."

      # 14. UPLOAD APK
      - name: Upload TRACK360 APK
        uses: actions/upload-artifact@v4
        with:
          name: TRACK360-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error

      # 15. BUILD SUMMARY
      - name: Build summary
        shell: bash
        run: |
          echo "=========================================="
          echo "TRACK360 BUILD SUCCESS"
          echo "=========================================="
          echo "Version : V8 EXCEL SYNTHESE"
          echo "Java    : 17"
          echo "Kotlin  : 17"
          echo "Gradle  : 8.9"
          echo "APK     : $APK_FILE"
          echo "=========================================="

name: Build TRACK360 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build TRACK360 APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Locate and extract TRACK360 project
        shell: bash
        run: |
          set -e

          echo "===== TRACK360 PROJECT ====="

          ZIP="TRACK360_FINAL_V2.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERREUR : $ZIP introuvable."
            echo "ZIP disponibles :"
            find . -maxdepth 2 -type f -name "*.zip" -print
            exit 1
          fi

          rm -rf track360_build
          mkdir -p track360_build

          unzip -q "$ZIP" -d track360_build

          echo "Contenu extrait :"
          find track360_build -maxdepth 3 -type f | head -100

      - name: Find Android Gradle project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find track360_build -type f -name "settings.gradle*" -o -name "build.gradle*" | head -1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR : aucun projet Gradle Android trouvé."
            find track360_build -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "Projet trouvé : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Force JVM 17 compatibility
        shell: bash
        run: |
          set -e

          cat > "$PROJECT_DIR/jvm17.gradle" <<'EOF'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  options.release = 17
              }

              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions {
                      jvmTarget = "17"
                  }
              }
          }
          EOF

          echo "JVM 17 configuration created:"
          cat "$PROJECT_DIR/jvm17.gradle"

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build TRACK360 Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=============================="
          echo " BUILD TRACK360 APK - JVM 17"
          echo "=============================="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            -I jvm17.gradle \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERREUR : APK introuvable."
            exit 1
          fi

          echo "APK trouvée : $APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload TRACK360 APK
        uses: actions/upload-artifact@v4
        with:
          name: TRACK360-debug-apk
          path: ${{ env.APK }}
          if-no-files-found: error

name: Build TRACK360 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract TRACK360 project
        run: |
          mkdir project
          unzip -q TRACK360_GITHUB_READY_V2.zip -d project
          echo "Contenu du projet :"
          find project -maxdepth 3 -type f | sort

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          
  - name: Fix Kotlin Serialization plugin
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("build.gradle.kts")
          text = root.read_text()

          if "org.jetbrains.kotlin.plugin.serialization" not in text:
              text = text.replace(
                  'id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false',
                  'id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false\n    id("org.jetbrains.kotlin.plugin.serialization") version "2.0.21" apply false'
              )
              root.write_text(text)

          app = Path("app/build.gradle.kts")
          text = app.read_text()

          if 'id("org.jetbrains.kotlin.plugin.serialization")' not in text:
              text = text.replace(
                  'id("org.jetbrains.kotlin.plugin.compose")',
                  'id("org.jetbrains.kotlin.plugin.compose")\n    id("org.jetbrains.kotlin.plugin.serialization")'
              )
              app.write_text(text)

          print("Kotlin Serialization plugin configuré.")
          PY

      - name: Build APK
        working-directory: project
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TRACK360-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk

name: Build TRACK360 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build TRACK360 APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. JDK 17
      # =========================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # =========================================================
      # 3. GRADLE 8.9
      # =========================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # =========================================================
      # 4. LOCATE TRACK360 ZIP
      # =========================================================
      - name: Locate TRACK360 ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "       SEARCH TRACK360 ZIP"
          echo "======================================"

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            \( -iname "TRACK360*.zip" -o -iname "*TRACK360*.zip" \) \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Aucun ZIP TRACK360 trouvé."
            echo ""
            echo "Fichiers disponibles :"
            find . -maxdepth 3 -type f | head -150
            exit 1
          fi

          echo "ZIP trouvé : $ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # =========================================================
      # 5. EXTRACT TRACK360
      # =========================================================
      - name: Extract TRACK360 project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "       EXTRACT TRACK360"
          echo "======================================"

          rm -rf track360_build
          mkdir -p track360_build

          unzip -q "$ZIP_FILE" -d track360_build

          echo ""
          echo "Contenu extrait :"
          find track360_build -maxdepth 4 -type f | head -150

      # =========================================================
      # 6. FIND ANDROID GRADLE PROJECT
      # =========================================================
      - name: Find Android Gradle project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "     FIND ANDROID GRADLE PROJECT"
          echo "======================================"

          PROJECT_DIR=$(find track360_build \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' \
            | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Aucun projet Android Gradle trouvé."

            echo ""
            echo "Structure du ZIP :"
            find track360_build -maxdepth 5 -type f

            exit 1
          fi

          echo "Projet trouvé : $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # =========================================================
      # 7. CHECK PROJECT
      # =========================================================
      - name: Check TRACK360 project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "          TRACK360 ANDROID"
          echo "======================================"

          cd "$PROJECT_DIR"

          echo ""
          echo "Répertoire :"
          pwd

          echo ""
          echo "Contenu :"
          ls -la

          echo ""
          echo "Fichiers Gradle :"

          find . -maxdepth 4 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \)

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then

            echo "ERROR: settings.gradle(.kts) absent."
            exit 1
          fi

      # =========================================================
      # 8. FORCE JVM 17
      # =========================================================
      - name: Force JVM 17 compatibility
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "       FORCE JAVA / KOTLIN 17"
          echo "======================================"

          find . -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print0 | while IFS= read -r -d '' FILE
          do

            echo ""
            echo "Correction : $FILE"

            # Java 1.8 -> Java 17
            sed -i \
              -E 's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' \
              "$FILE" || true

            # Kotlin JVM 1.8 -> 17
            sed -i \
              -E 's/JvmTarget\.JVM_1_8/JvmTarget.JVM_17/g' \
              "$FILE" || true

            # jvmTarget = "1.8" -> "17"
            sed -i \
              -E 's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/jvmTarget = "17"/g' \
              "$FILE" || true

            # jvmTarget = "8" -> "17"
            sed -i \
              -E 's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']8["'\'']/jvmTarget = "17"/g' \
              "$FILE" || true

            # sourceCompatibility 1.8 -> 17
            sed -i \
              -E 's/sourceCompatibility[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/sourceCompatibility = JavaVersion.VERSION_17/g' \
              "$FILE" || true

            # targetCompatibility 1.8 -> 17
            sed -i \
              -E 's/targetCompatibility[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/targetCompatibility = JavaVersion.VERSION_17/g' \
              "$FILE" || true

            # options.release 8
            sed -i \
              -E '/options\.release\.set\(8\)/d' \
              "$FILE" || true

            # options.release Java 8
            sed -i \
              -E '/options\.release\.set\(JavaLanguageVersion\.of\(8\)\)/d' \
              "$FILE" || true

          done

          echo ""
          echo "JAVA_HOME=$JAVA_HOME"

          echo ""
          echo "Java :"
          java -version

          echo ""
          echo "Gradle :"
          gradle --version

      # =========================================================
      # 9. PREPARE GRADLE COMMAND
      # =========================================================
      - name: Configure Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "        CONFIGURE GRADLE"
          echo "======================================"

          if [ -f "gradlew" ]; then
            echo "Gradle Wrapper trouvé."

            chmod +x gradlew

            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"

          else
            echo "Gradle Wrapper absent."
            echo "Utilisation de Gradle 8.9 installé par GitHub Actions."

            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          fi

      # =========================================================
      # 10. BUILD DEBUG APK
      # =========================================================
      - name: Build TRACK360 Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "        BUILD TRACK360 APK"
          echo "        GRADLE 8.9"
          echo "        JAVA 17"
          echo "======================================"

          $GRADLE_CMD \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      # =========================================================
      # 11. FIND APK
      # =========================================================
      - name: Find TRACK360 APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "             FIND APK"
          echo "======================================"

          APK_PATH=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | grep -E "(debug|release)" \
            | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK introuvable."

            echo ""
            echo "Recherche complète :"
            find "$PROJECT_DIR" -type f -name "*.apk" || true

            exit 1
          fi

          echo "APK trouvé : $APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      # =========================================================
      # 12. VERIFY APK
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "          VERIFY APK"
          echo "======================================"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK absent."
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: APK vide."
            exit 1
          fi

          ls -lh "$APK_PATH"

          file "$APK_PATH"

          echo ""
          echo "APK TRACK360 valide."

      # =========================================================
      # 13. UPLOAD APK
      # =========================================================
      - name: Upload TRACK360 APK
        uses: actions/upload-artifact@v4
        with:
          name: TRACK360-debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

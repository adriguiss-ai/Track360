name: Build TRACK360 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build TRACK360 APK
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # 2. JDK 17
      # ============================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'


      # ============================================================
      # 3. GRADLE 8.9
      # ============================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ============================================================
      # 4. FIND TRACK360 V6 ZIP
      # ============================================================
      - name: Locate TRACK360 V6 ZIP
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCH TRACK360 V6 ZIP"
          echo "=========================================="

          ZIP_FILE="TRACK360_Android_Project_V6_CORRIGE.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE introuvable."
            echo ""
            echo "Fichiers présents dans le repository:"
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "ZIP trouvé : $ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"


      # ============================================================
      # 5. EXTRACT ZIP
      # ============================================================
      - name: Extract TRACK360 V6 project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "EXTRACT TRACK360 V6 ZIP"
          echo "=========================================="

          rm -rf track360_build
          mkdir -p track360_build

          unzip -q "$ZIP_FILE" -d track360_build

          echo ""
          echo "Contenu extrait:"
          find track360_build -maxdepth 4 -type f -print | head -200


      # ============================================================
      # 6. FIND ANDROID GRADLE PROJECT
      # ============================================================
      - name: Find Android Gradle project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "FIND ANDROID GRADLE PROJECT"
          echo "=========================================="

          SETTINGS_FILE=$(find track360_build \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Aucun projet Gradle Android trouvé."
            echo ""
            find track360_build -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 7. CHECK PROJECT
      # ============================================================
      - name: Check TRACK360 project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "TRACK360 ANDROID PROJECT"
          echo "=========================================="

          echo "Project directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "Gradle files:"
          find . -maxdepth 3 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradlew" \) \
            -print


      # ============================================================
      # 8. PREPARE GRADLE WRAPPER
      # ============================================================
      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper trouvé."
          else
            echo "Gradle wrapper absent."
            echo "Gradle 8.9 installé par GitHub Actions sera utilisé."
          fi


      # ============================================================
      # 9. FORCE JAVA 17 + KOTLIN JVM 17
      # ============================================================
      - name: Configure Java and Kotlin JVM 17
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "CONFIGURE JAVA 17 + KOTLIN JVM 17"
          echo "=========================================="

          cat > track360-jvm17.gradle <<'EOF'

          import org.gradle.api.tasks.compile.JavaCompile

          allprojects {

              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"

                  options.release.set(17)
              }

              tasks.configureEach { task ->

                  if (task.name.toLowerCase().contains("kotlin")) {

                      try {
                          if (task.hasProperty("kotlinOptions")) {
                              task.kotlinOptions.jvmTarget = "17"
                          }
                      } catch (Exception ignored) {
                      }

                      try {
                          def compilerOptions = task.property("compilerOptions")
                          compilerOptions.jvmTarget.set(
                              org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                          )
                      } catch (Exception ignored) {
                      }
                  }
              }

              afterEvaluate { project ->

                  def androidExtension =
                      project.extensions.findByName("android")

                  if (androidExtension != null) {

                      try {
                          androidExtension.compileOptions.sourceCompatibility =
                              JavaVersion.VERSION_17

                          androidExtension.compileOptions.targetCompatibility =
                              JavaVersion.VERSION_17
                      } catch (Exception ignored) {
                      }
                  }
              }
          }

          EOF

          echo "Configuration JVM 17 créée."


      # ============================================================
      # 10. CLEAN
      # ============================================================
      - name: Clean TRACK360
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "CLEAN PROJECT"
          echo "=========================================="

          if [ -f "./gradlew" ]; then
            ./gradlew clean \
              --no-daemon \
              -I track360-jvm17.gradle
          else
            gradle clean \
              --no-daemon \
              -I track360-jvm17.gradle
          fi


      # ============================================================
      # 11. BUILD DEBUG APK
      # ============================================================
      - name: Build TRACK360 Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "BUILD TRACK360 V6 APK"
          echo "=========================================="

          echo "Gradle : 8.9"
          echo "Java   : 17"
          echo "Kotlin : 17"

          echo "=========================================="

          if [ -f "./gradlew" ]; then

            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              -I track360-jvm17.gradle

          else

            gradle assembleDebug \
              --no-daemon \
              --stacktrace \
              --warning-mode all \
              -I track360-jvm17.gradle

          fi


      # ============================================================
      # 12. FIND APK
      # ============================================================
      - name: Find TRACK360 APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "=========================================="
          echo "FIND APK"
          echo "=========================================="

          APK_FILE=$(find . \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            -print \
            | grep -E "debug.*\.apk$" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK Debug introuvable."
            echo ""
            echo "APK disponibles:"
            find . -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK trouvée:"
          echo "$APK_FILE"

          APK_ABSOLUTE="$(realpath "$APK_FILE")"

          echo "APK_PATH=$APK_ABSOLUTE" >> "$GITHUB_ENV"


      # ============================================================
      # 13. VERIFY APK
      # ============================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFY APK"
          echo "=========================================="

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK absente."
            exit 1
          fi

          echo "APK:"
          ls -lh "$APK_PATH"

          FILE_SIZE=$(stat -c%s "$APK_PATH")

          if [ "$FILE_SIZE" -lt 10000 ]; then
            echo "ERROR: APK anormalement petite."
            exit 1
          fi

          echo ""
          echo "APK valide."
          echo "Taille: $FILE_SIZE bytes"


      # ============================================================
      # 14. UPLOAD APK
      # ============================================================
      - name: Upload TRACK360 APK
        uses: actions/upload-artifact@v4
        with:
          name: TRACK360-debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error


      # ============================================================
      # 15. BUILD SUMMARY
      # ============================================================
      - name: Build summary
        shell: bash
        run: |
          echo "=========================================="
          echo "TRACK360 BUILD SUCCESS"
          echo "=========================================="
          echo "Java   : 17"
          echo "Kotlin : 17"
          echo "Gradle : 8.9"
          echo "APK    : $APK_PATH"
          echo "=========================================="

name: Build TRACK360 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Find and extract TRACK360 package
        run: |
          echo "=== Recherche du package corrigé ==="

          ZIP=$(find . -maxdepth 1 -type f -name 'TRACK360_CORRECTED_*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : package TRACK360_CORRECTED introuvable."
            echo "Fichiers ZIP disponibles :"
            find . -maxdepth 1 -type f -name '*.zip' -print
            exit 1
          fi

          echo "Package trouvé : $ZIP"

          mkdir -p project

          unzip -q "$ZIP" -d project

          echo "=== Structure du projet ==="
          find project -maxdepth 3 -type f | sort

      - name: Detect Android project directory
        run: |
          echo "=== Recherche de gradlew ==="

          GRADLEW=$(find project -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERREUR : gradlew introuvable."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Gradlew trouvé : $GRADLEW"
          echo "Projet Android : $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Java version
        run: |
          java -version

      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew --version

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== BUILD TRACK360 APK ==="
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Recherche de l'APK ==="

          find . -type f -name "*.apk" -print

          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERREUR : APK introuvable."
            exit 1
          fi

          echo "APK trouvé : $APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TRACK360-debug-apk
          path: ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
          if-no-files-found: error

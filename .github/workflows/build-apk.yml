name: Build TRACK360 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build TRACK360 APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate TRACK360 ZIP
        shell: bash
        run: |
          set -e

          echo "Recherche du ZIP TRACK360..."

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*TRACK360*.zip" | head -n 1 || true)

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1 || true)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERREUR : aucun ZIP trouvé."
            find . -maxdepth 3 -type f -print
            exit 1
          fi

          echo "ZIP trouvé : $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract TRACK360 project
        shell: bash
        run: |
          set -e

          rm -rf track360_build
          mkdir -p track360_build

          unzip -q "$ZIP_FILE" -d track360_build

          echo "Contenu extrait :"
          find track360_build -maxdepth 4 -type f -print

      - name: Find Android Gradle project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          SETTINGS_FILE=$(find track360_build -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1 || true)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            BUILD_FILE=$(find track360_build -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              | head -n 1 || true)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR : projet Gradle Android introuvable."
            find track360_build -maxdepth 6 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "Projet trouvé : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check TRACK360 project
        shell: bash
        run: |
          set -e

          echo "================================"
          echo "TRACK360 ANDROID PROJECT"
          echo "================================"

          echo "PROJECT_DIR=$PROJECT_DIR"

          ls -la "$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERREUR : settings.gradle absent."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "ERREUR : build.gradle absent."
            exit 1
          fi

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Force Java and Kotlin JVM 17
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Correction de la compatibilité JVM..."

          find . -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print0 | while IFS= read -r -d '' FILE
          do
            echo "Correction : $FILE"

            sed -i \
              's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' \
              "$FILE" || true

            sed -i \
              's/JavaVersion.VERSION_8/JavaVersion.VERSION_17/g' \
              "$FILE" || true

            sed -i \
              's/jvmTarget[[:space:]]*=[[:space:]]*"1\.8"/jvmTarget = "17"/g' \
              "$FILE" || true

            sed -i \
              "s/jvmTarget[[:space:]]*=[[:space:]]*'1\.8'/jvmTarget = '17'/g" \
              "$FILE" || true

            sed -i \
              's/sourceCompatibility[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/sourceCompatibility = JavaVersion.VERSION_17/g' \
              "$FILE" || true

            sed -i \
              's/targetCompatibility[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/targetCompatibility = JavaVersion.VERSION_17/g' \
              "$FILE" || true
          done

          echo "Configuration JVM détectée :"

          grep -Rni \
            -E "jvmTarget|sourceCompatibility|targetCompatibility|VERSION_1_8|VERSION_17" \
            --include="build.gradle" \
            --include="build.gradle.kts" \
            . || true

      - name: Check Java and Gradle
        shell: bash
        run: |
          set -e

          echo "JAVA :"
          java -version

          echo ""
          echo "GRADLE :"
          gradle --version

      - name: Build TRACK360 Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "================================"
          echo "BUILD TRACK360 APK"
          echo "Gradle 8.9"
          echo "Java 17"
          echo "================================"

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      - name: Find TRACK360 APK
        shell: bash
        run: |
          set -e

          APK_FILE=$(find "$PROJECT_DIR" \
            -type f \
            -name "*debug*.apk" \
            | head -n 1 || true)

          if [ -z "$APK_FILE" ]; then
            echo "ERREUR : APK non trouvé."

            find "$PROJECT_DIR" \
              -type f \
              -name "*.apk" \
              -print || true

            exit 1
          fi

          echo "APK trouvé : $APK_FILE"

          cp "$APK_FILE" "$GITHUB_WORKSPACE/TRACK360-debug.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -e

          if [ ! -f "$GITHUB_WORKSPACE/TRACK360-debug.apk" ]; then
            echo "ERREUR : APK absent."
            exit 1
          fi

          ls -lh "$GITHUB_WORKSPACE/TRACK360-debug.apk"

      - name: Upload TRACK360 APK
        uses: actions/upload-artifact@v4
        with:
          name: TRACK360-APK
          path: TRACK360-debug.apk
          if-no-files-found: error

name: Build TRACK360 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract project
        run: |
          mkdir project
          unzip -q TRACK360_GITHUB_READY_V2.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      
      - name: Fix Android JVM target
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path("app/build.gradle.kts")
          text = app.read_text()

          block = '''
          
          // TRACK360 - Java/Kotlin JVM 17 compatibility
          tasks.withType<JavaCompile>().configureEach {
              sourceCompatibility = "17"
              targetCompatibility = "17"
          }
          '''

          if "TRACK360 - Java/Kotlin JVM 17 compatibility" not in text:
              text += block

          app.write_text(text)
          print("Java JVM target configuré sur 17.")
          PY

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TRACK360-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
    

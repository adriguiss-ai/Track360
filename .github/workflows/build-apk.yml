name: Build TRACK360 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build TRACK360 APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. JDK 17
      # =========================================================
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # =========================================================
      # 3. INSTALL GRADLE 8.9
      # =========================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # =========================================================
      # 4. FIND TRACK360 ZIP
      # =========================================================
      - name: Locate TRACK360 ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "       TRACK360 - SEARCH ZIP"
          echo "======================================"

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            \( -iname "TRACK360*.zip" -o -iname "*TRACK360*.zip" \) \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Aucun ZIP TRACK360 trouvé."
            echo "Fichiers présents :"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "ZIP trouvé : $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # =========================================================
      # 5. EXTRACT PROJECT
      # =========================================================
      - name: Extract TRACK360 project
        shell: bash
        run: |
          set -e

          rm -rf track360_build
          mkdir -p track360_build

          unzip -q "$ZIP_FILE" -d track360_build

          echo "======================================"
          echo "       EXTRACTION TERMINEE"
          echo "======================================"

          find track360_build -maxdepth 3 -type f | head -100

      # =========================================================
      # 6. FIND ANDROID PROJECT
      # =========================================================
      - name: Find Android Gradle project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "       RECHERCHE PROJET ANDROID"
          echo "======================================"

          PROJECT_DIR=$(find track360_build -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            -printf '%h\n' \
            | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Aucun projet Gradle Android trouvé."
            echo ""
            echo "Contenu extrait :"
            find track360_build -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # =========================================================
      # 7. CHECK PROJECT
      # =========================================================
      - name: Check TRACK360 project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "          TRACK360 ANDROID"
          echo "======================================"

          cd "$PROJECT_DIR"

          echo ""
          echo "Contenu :"
          ls -la

          echo ""
          echo "Gradle files :"
          find . -maxdepth 3 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \)

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle(.kts) absent."
            exit 1
          fi

      # =========================================================
      # 8. FORCE JAVA/KOTLIN 17
      # =========================================================
      - name: Force JVM 17 compatibility
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "       FORCE JAVA / KOTLIN 17"
          echo "======================================"

          find . -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print0 | while IFS= read -r -d '' FILE
          do
            echo ""
            echo "Correction : $FILE"

            # Supprime les anciennes configurations release Java 8
            sed -i \
              -E '/options\.release\.set\(.*\)/d' "$FILE" || true

            sed -i \
              -E '/options\.release\.set\(JavaLanguageVersion.*\)/d' "$FILE" || true

            # Java 1.8 -> 17
            sed -i \
              -E 's/sourceCompatibility[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/sourceCompatibility = JavaVersion.VERSION_17/g' "$FILE" || true

            sed -i \
              -E 's/targetCompatibility[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/targetCompatibility = JavaVersion.VERSION_17/g' "$FILE" || true

            # Kotlin 1.8 / 8 -> 17
            sed -i \
              -E 's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']1\.8["'\'']/jvmTarget = "17"/g' "$FILE" || true

            sed -i \
              -E 's/jvmTarget[[:space:]]*=[[:space:]]*["'\'']8["'\'']/jvmTarget = "17"/g' "$FILE" || true

            # JavaVersion.VERSION_1_8 -> VERSION_17
            sed -i \
              -E 's/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g' "$FILE" || true

            # VERSION_1_8 -> VERSION_17
            sed -i \
              -E 's/JvmTarget\.JVM_1_8/JvmTarget.JVM_17/g' "$FILE" || true
          done

          echo ""
          echo "Java version :"
          java -version

          echo ""
          echo "Gradle version :"
          gradle --version

      # =========================================================
      # 9. CONFIGURE GRADLE
      # =========================================================
      - name: Configure Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "       CONFIGURATION GRADLE"
          echo "======================================"

          export JAVA_HOME="$JAVA_HOME"

          if [ -f "gradlew" ]; then
            chmod +x gradlew
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi

          echo "GRADLE_CMD=$GRADLE_CMD" >> "$GITHUB_ENV"

          echo "Gradle command : $GRADLE_CMD"

          $GRADLE_CMD --version

      # =========================================================
      # 10. BUILD APK
      # =========================================================
      - name: Build TRACK360 Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "       BUILD TRACK360 APK"
          echo "       GRADLE 8.9"
          echo "       JAVA 17"
          echo "======================================"

          $GRADLE_CMD \
            --no-daemon \
            --stacktrace \
            --info \
            :app:assembleDebug

      # =========================================================
      # 11. FIND APK
      # =========================================================
      - name: Find TRACK360 APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "          RECHERCHE APK"
          echo "======================================"

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | grep -E "debug|release" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK introuvable."
            find "$PROJECT_DIR" -type f | grep -i apk || true
            exit 1
          fi

          echo "APK trouvé : $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # =========================================================
      # 12. VERIFY APK
      # =========================================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "          VERIFICATION APK"
          echo "======================================"

          ls -lh "$APK_PATH"

          file "$APK_PATH"

          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: APK vide."
            exit 1
          fi

          echo "APK TRACK360 valide."

      # =========================================================
      # 13. UPLOAD APK
      # =========================================================
      - name: Upload TRACK360 APK
        uses: actions/upload-artifact@v4
        with:
          name: TRACK360-debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

name: Build TRACK360 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. INSTALL UNZIP
      # ============================================================
      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      # ============================================================
      # 3. FIND AND EXTRACT TRACK360 PACKAGE
      # ============================================================
      - name: Find and extract TRACK360 package
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Recherche du package TRACK360"
          echo "========================================"

          ZIP_FILE=$(find . -maxdepth 3 -type f \
            \( -name "TRACK360_GITHUB_READY_V2.zip" \
            -o -name "TRACK360_GITHUB_READY.zip" \
            -o -name "*.zip" \) \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERREUR : aucun fichier ZIP TRACK360 trouvé."
            exit 1
          fi

          echo "ZIP trouvé : $ZIP_FILE"

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo "========================================"
          echo "Contenu extrait"
          echo "========================================"

          find project -maxdepth 4 -type f | sort

      # ============================================================
      # 4. DETECT ANDROID PROJECT DIRECTORY
      # ============================================================
      - name: Detect Android project directory
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Recherche du projet Android"
          echo "========================================"

          PROJECT_DIR=""

          # Recherche d'un build.gradle.kts + app
          while IFS= read -r FILE; do
            DIR=$(dirname "$FILE")

            if [ -d "$DIR/app" ]; then
              if [ -f "$DIR/settings.gradle.kts" ] || \
                 [ -f "$DIR/settings.gradle" ]; then
                PROJECT_DIR="$DIR"
                break
              fi
            fi
          done < <(find project -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | sort)

          # Deuxième méthode : recherche de gradlew
          if [ -z "$PROJECT_DIR" ]; then
            GRADLEW=$(find project -type f -name "gradlew" | head -n 1 || true)

            if [ -n "$GRADLEW" ]; then
              PROJECT_DIR=$(dirname "$GRADLEW")
            fi
          fi

          # Dernière méthode : dossier project/app
          if [ -z "$PROJECT_DIR" ] && [ -d "project/app" ]; then
            PROJECT_DIR="project"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERREUR : projet Android introuvable."
            echo ""
            echo "Structure trouvée :"
            find project -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "Projet Android détecté : $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # 5. SETUP JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 6. CHECK JAVA
      # ============================================================
      - name: Check Java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      # ============================================================
      # 7. SETUP GRADLE
      # ============================================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # ============================================================
      # 8. CHECK GRADLE
      # ============================================================
      - name: Check Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --version

      # ============================================================
      # 9. FIX GRADLE / KOTLIN / COMPOSE
      # ============================================================
      - name: Fix Gradle configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Correction configuration Gradle"
          echo "========================================"

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("build.gradle.kts")
          app = Path("app/build.gradle.kts")

          if not root.exists():
              raise SystemExit("ERREUR : build.gradle.kts introuvable")

          if not app.exists():
              raise SystemExit("ERREUR : app/build.gradle.kts introuvable")

          root_text = root.read_text()
          app_text = app.read_text()

          # --------------------------------------------------------
          # Kotlin Serialization
          # --------------------------------------------------------

          if "org.jetbrains.kotlin.plugin.serialization" not in root_text:

              match = re.search(
                  r'id\(["\']org\.jetbrains\.kotlin\.android["\']\)\s*version\s*["\']([^"\']+)["\']',
                  root_text
              )

              kotlin_version = match.group(1) if match else "2.0.21"

              if "plugins {" in root_text:
                  root_text = root_text.replace(
                      "plugins {",
                      "plugins {\n"
                      f'    id("org.jetbrains.kotlin.plugin.serialization") version "{kotlin_version}"',
                      1
                  )

          # --------------------------------------------------------
          # Compose Compiler
          # IMPORTANT pour Kotlin 2.0+
          # --------------------------------------------------------

          if "org.jetbrains.kotlin.plugin.compose" not in root_text:

              match = re.search(
                  r'id\(["\']org\.jetbrains\.kotlin\.android["\']\)\s*version\s*["\']([^"\']+)["\']',
                  root_text
              )

              kotlin_version = match.group(1) if match else "2.0.21"

              if "plugins {" in root_text:
                  root_text = root_text.replace(
                      "plugins {",
                      "plugins {\n"
                      f'    id("org.jetbrains.kotlin.plugin.compose") version "{kotlin_version}"',
                      1
                  )

          # --------------------------------------------------------
          # Application des plugins dans app
          # --------------------------------------------------------

          if "org.jetbrains.kotlin.plugin.serialization" not in app_text:
              if "plugins {" in app_text:
                  app_text = app_text.replace(
                      "plugins {",
                      "plugins {\n"
                      '    id("org.jetbrains.kotlin.plugin.serialization")',
                      1
                  )

          if "org.jetbrains.kotlin.plugin.compose" not in app_text:
              if "plugins {" in app_text:
                  app_text = app_text.replace(
                      "plugins {",
                      "plugins {\n"
                      '    id("org.jetbrains.kotlin.plugin.compose")',
                      1
                  )

          # --------------------------------------------------------
          # JVM 17
          # --------------------------------------------------------

          if "TRACK360 JVM CONFIGURATION" not in app_text:

              jvm_config = r'''

          // ========================================================
          // TRACK360 JVM CONFIGURATION
          // ========================================================

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          '''

              app_text += jvm_config

          # --------------------------------------------------------
          # Sauvegarde
          # --------------------------------------------------------

          root.write_text(root_text)
          app.write_text(app_text)

          print("========================================")
          print("Configuration corrigée")
          print("Kotlin Serialization : OK")
          print("Compose Compiler     : OK")
          print("Java JVM target      : 17")
          print("Kotlin JVM target    : 17")
          print("========================================")
          PY

      # ============================================================
      # 10. DISPLAY CONFIGURATION
      # ============================================================
      - name: Check Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "========================================"
          echo "Structure du projet"
          echo "========================================"

          find . -maxdepth 3 -type f \
            \( -name "*.gradle" \
            -o -name "*.gradle.kts" \
            -o -name "settings.gradle*" \
            -o -name "gradle.properties" \) \
            | sort

          echo ""
          echo "========================================"
          echo "Root build.gradle.kts"
          echo "========================================"

          if [ -f build.gradle.kts ]; then
            cat build.gradle.kts
          fi

          echo ""
          echo "========================================"
          echo "App build.gradle.kts"
          echo "========================================"

          if [ -f app/build.gradle.kts ]; then
            cat app/build.gradle.kts
          fi

      # ============================================================
      # 11. BUILD APK
      # ============================================================
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILD TRACK360 APK"
          echo "========================================"

          gradle assembleDebug --no-daemon --stacktrace

      # ============================================================
      # 12. VERIFY APK
      # ============================================================
      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Recherche de l'APK"
          echo "========================================"

          find . -type f -name "*.apk" -print

          APK=$(find app/build/outputs/apk/debug \
            -type f -name "*.apk" \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "ERREUR : APK introuvable."
            exit 1
          fi

          echo ""
          echo "APK trouvé avec succès :"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # ============================================================
      # 13. UPLOAD APK
      # ============================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TRACK360-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

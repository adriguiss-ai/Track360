name: Build TRACK360 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract project
        run: |
          mkdir project
          unzip -q TRACK360_GITHUB_READY_V2.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'


      - name: Fix Gradle configuration
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("build.gradle.kts")
          app = Path("app/build.gradle.kts")

          r = root.read_text()
          a = app.read_text()

          # Ajouter le plugin Serialization au niveau racine avec une version
          if 'id("org.jetbrains.kotlin.plugin.serialization")' not in r:
              marker = 'plugins {'
              if marker in r:
                  r = r.replace(
                      marker,
                      marker + '\n    id("org.jetbrains.kotlin.plugin.serialization") version "2.0.21" apply false',
                      1
                  )

          # Activer le plugin dans l'application
          if 'id("org.jetbrains.kotlin.plugin.serialization")' not in a:
              marker = 'plugins {'
              if marker in a:
                  a = a.replace(
                      marker,
                      marker + '\n    id("org.jetbrains.kotlin.plugin.serialization")',
                      1
                  )

          # Forcer Java 17
          if "TRACK360_JVM17" not in a:
              a += '''

          // TRACK360_JVM17
          tasks.withType<JavaCompile>().configureEach {
              sourceCompatibility = "17"
              targetCompatibility = "17"
          }
          '''

          root.write_text(r)
          app.write_text(a)

          print("Configuration Gradle corrigée.")
          print("Root build.gradle.kts:")
          print(r)
          print("App build.gradle.kts:")
          print(a)
          PY

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TRACK360-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
    
